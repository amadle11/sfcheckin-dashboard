name: ABC check-ins to BigQuery

on:
  schedule:
    - cron: "15 * * * *"   # every hour at :15 (UTC): yesterday + today's check-ins (club time)
    - cron: "0 9 * * *"    # daily, 4 AM Eastern: refresh member names
  workflow_dispatch:
    inputs:
      mode:
        description: "normal (check-ins), members (refresh names), setup (create tables/view), or probe"
        default: normal
        type: choice
        options: [normal, members, setup, probe]
      start:
        description: "Backfill start date, YYYY-MM-DD (optional)"
        required: false
      end:
        description: "Backfill end date, YYYY-MM-DD (optional)"
        required: false

concurrency:
  group: abc-ingest
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # only used by the keep-alive step below

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r ingest/requirements.txt
      - name: Run ingest
        env:
          PYTHONUNBUFFERED: "1"
          ABC_APP_ID: ${{ secrets.ABC_APP_ID }}
          ABC_APP_KEY: ${{ secrets.ABC_APP_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 9 * * *' && 'members') || 'normal' }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          ARGS=""
          [ "$MODE" = "setup" ] && ARGS="$ARGS --setup"
          [ "$MODE" = "probe" ] && ARGS="$ARGS --probe"
          [ "$MODE" = "members" ] && ARGS="$ARGS --members"
          [ -n "$START" ] && ARGS="$ARGS --start $START"
          [ -n "$END" ] && ARGS="$ARGS --end $END"
          python ingest/abc_to_bigquery.py $ARGS
      # GitHub turns off scheduled workflows in public repos after 60 days without a
      # commit. Re-enabling the workflow on each run keeps the hourly import alive.
      - name: Keep schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable"
